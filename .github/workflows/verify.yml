name: Validate independent candidate B
on:
  push:
    branches: [independent-build-b]
  pull_request:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python -m architect.cli plan examples/workspace.json
      - run: python -m architect.cli generate examples/workspace.json --out ./build-output
      - run: python -m architect.cli check ./build-output
