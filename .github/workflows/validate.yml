name: Verify starter
on:
  pull_request:
  push:
    branches: [main, independent-build-b]
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/bootstrap.py plan examples/sample-business.json
